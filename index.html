<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belajar MySQL Kilat</title>
<style>
:root{
  --bg:#fbfbf9; --bg2:#f2f2ee; --card:#ffffff; --fg:#1d1f23; --mut:#5d6370; --line:#e1e1da;
  --acc:#2563eb; --acc2:#dbe7ff; --ok:#15803d; --okbg:#e3f5e8; --bad:#b91c1c; --badbg:#fde8e8;
  --warn:#9a5b00; --warnbg:#fff4dc; --info:#1e5aa8; --infobg:#e8f1fd; --nullbg:#fff1c7;
  --code:#f4f4f0; --t-kw:#7c3aed; --t-str:#047857; --t-num:#c2410c; --t-fn:#1d4ed8; --t-cm:#8a8f98; --t-var:#be185d;
  --venn-a:#3b82f6; --venn-b:#f59e0b; --venn-fill:#22c55e;
  --font:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#15171b; --bg2:#1c1f24; --card:#1f2228; --fg:#e6e7ea; --mut:#9aa1ad; --line:#30343c;
  --acc:#6ea0ff; --acc2:#22304d; --ok:#4ade80; --okbg:#173322; --bad:#f87171; --badbg:#3a1d1d;
  --warn:#fbbf24; --warnbg:#3a2e12; --info:#93c5fd; --infobg:#172a44; --nullbg:#4a3d10;
  --code:#191b20; --t-kw:#c4a1ff; --t-str:#6ee7b7; --t-num:#fdba74; --t-fn:#93c5fd; --t-cm:#7b818c; --t-var:#f9a8d4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--font)}
a{color:var(--acc)}
code,pre,textarea{font-family:var(--mono);font-size:14px}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header.top .brand{font-weight:700;white-space:nowrap}
header.top .brand small{font-weight:400;color:var(--mut)}
.prog{flex:1;display:flex;align-items:center;gap:8px;min-width:120px}
.prog .bar{flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.prog span{font-size:13px;color:var(--mut);white-space:nowrap}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1220}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
#menuBtn{display:none}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav.side{width:280px;flex:none;border-right:1px solid var(--line);background:var(--bg2);position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto;padding:12px 8px 40px}
nav.side a{display:flex;justify-content:space-between;gap:6px;text-decoration:none;color:var(--fg);padding:6px 10px;border-radius:7px;font-size:14.5px}
nav.side a:hover{background:var(--card)}
nav.side a.cur{background:var(--acc2);font-weight:600}
nav.side a .cnt{font-size:12px;color:var(--mut);font-weight:400}
nav.side a .cnt.done{color:var(--ok)}
nav.side .subs a{padding:3px 10px 3px 24px;font-size:13.5px;color:var(--mut)}
nav.side .subs a.solved::after{content:"✓";color:var(--ok)}
main{flex:1;min-width:0;padding:24px 32px 120px;max-width:980px}
h1{font-size:28px;line-height:1.25;margin:4px 0 8px}
h2{font-size:22px;margin:48px 0 8px;padding-top:12px;border-top:2px solid var(--line)}
h3{font-size:16px;margin:24px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
p{margin:8px 0}
.lead{color:var(--mut);font-size:17px}
.box{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 16px;margin:12px 0}
.analogi{border-left:4px solid var(--acc);background:var(--acc2);border-radius:6px;padding:8px 14px;margin:10px 0}
.warn{border-left:4px solid var(--warn);background:var(--warnbg);border-radius:6px;padding:8px 14px;margin:10px 0}
.warn b:first-child{color:var(--warn)}
.tip{border-left:4px solid var(--ok);background:var(--okbg);border-radius:6px;padding:8px 14px;margin:10px 0}
.ringkas{border:2px dashed var(--ok);border-radius:10px;padding:10px 16px;margin:24px 0 8px;font-weight:600}
.salah li{margin:4px 0}
.salah li::marker{content:"✗  ";color:var(--bad)}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 14px;overflow:auto;margin:8px 0;line-height:1.55;white-space:pre}
.t-kw{color:var(--t-kw);font-weight:600}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-fn{color:var(--t-fn)}.t-cm{color:var(--t-cm);font-style:italic}.t-var{color:var(--t-var)}
table.ket{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
table.ket td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.ket td:first-child{white-space:nowrap;width:1%}
table.ket code{background:var(--code);padding:1px 6px;border-radius:4px}
table.data{border-collapse:collapse;font-size:14px;margin:6px 0}
table.data th,table.data td{border:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}
table.data th{background:var(--bg2);font-weight:600}
table.data td.null{color:var(--mut);font-style:italic}
table.data tr.hl td{background:var(--nullbg)}
table.data tr.gone td{text-decoration:line-through;opacity:.55;background:var(--badbg)}
table.data tr.in td{background:var(--okbg)}
table.cmp{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.cmp th{background:var(--bg2)}
.tblwrap{overflow:auto;max-width:100%}
/* editor */
.ed{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--code);margin:6px 0}
.ed:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.ed pre,.ed textarea{margin:0;padding:10px 14px;font-family:var(--mono);font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;tab-size:2;border:0;letter-spacing:0}
.ed pre{pointer-events:none;color:var(--fg);min-height:42px}
.ed textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--fg);outline:none;overflow:hidden}
.ed textarea::selection{background:rgba(100,140,255,.35);color:transparent}
.runbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
.runbar .hint{font-size:12.5px;color:var(--mut)}
.out{margin:6px 0 4px}
.out .msg{font-size:14px;padding:6px 10px;border-radius:6px;margin:4px 0}
.out .msg.err{background:var(--badbg);color:var(--bad)}
.out .msg.ok{background:var(--okbg);color:var(--ok)}
.out .msg.info{background:var(--infobg);color:var(--info)}
.out .tr{font-size:12.5px;color:var(--mut);margin:2px 0}
.out .tr code{background:var(--code);padding:1px 5px;border-radius:4px}
.out .cap{font-size:12.5px;color:var(--mut)}
.contoh{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:14px 0;background:var(--card)}
.contoh .lbl{font-size:12.5px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.contoh .why{font-size:15px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.lat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:14px 0;background:var(--card)}
.lat.done{border-color:var(--ok)}
.lat .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvl{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;text-transform:uppercase}
.lvl.mudah{background:var(--okbg);color:var(--ok)}.lvl.sedang{background:var(--warnbg);color:var(--warn)}.lvl.sulit{background:var(--badbg);color:var(--bad)}
.lat .badge{margin-left:auto;font-size:13px;color:var(--ok);font-weight:600}
.lat .q{margin:6px 0}
.hints .h{font-size:14.5px;background:var(--infobg);border-radius:6px;padding:5px 10px;margin:4px 0}
.ans{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.mc label{display:block;padding:5px 10px;border:1px solid var(--line);border-radius:7px;margin:5px 0;cursor:pointer}
.mc label:hover{border-color:var(--acc)}
.mc label.right{border-color:var(--ok);background:var(--okbg)}
.mc label.wrong{border-color:var(--bad);background:var(--badbg)}
/* diagram */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:10px 0}
.flow .st{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;min-width:92px;text-align:center}
.flow .st b{display:block;font-family:var(--mono);color:var(--t-kw)}
.flow .st small{color:var(--mut);font-size:12.5px;line-height:1.3;display:block}
.flow .st .n{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;width:20px;height:20px;font-size:12px;line-height:20px;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--mut);font-size:18px}
.venn{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:8px 0}
.venn svg{flex:none}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.legend{font-size:13px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin:4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.erd svg{max-width:100%;height:auto}
.erd text{font-family:var(--font)}
.step-ctrl{display:flex;gap:8px;align-items:center;margin:6px 0}
.step-msg{font-size:15px;background:var(--infobg);border-radius:6px;padding:6px 10px;margin:6px 0;min-height:36px}
/* playground drawer */
#pg{position:fixed;right:0;top:52px;bottom:0;width:min(560px,100vw);background:var(--card);border-left:1px solid var(--line);z-index:40;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
#pg.open{transform:none}
#pg .pgh{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#pg .pgb{padding:10px 14px;overflow:auto;flex:1}
#pg .tbls{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
#loading{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;z-index:50;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.navbtm{display:flex;justify-content:space-between;margin-top:48px;gap:8px}
/* quiz */
.quizbar{position:sticky;top:52px;z-index:10;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:20px;font-weight:700}
.timer.low{color:var(--bad)}
.qz{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;background:var(--card)}
.qz.right{border-color:var(--ok)}.qz.wrong{border-color:var(--bad)}
.qz .tag{font-size:12px;color:var(--mut)}
.score{font-size:40px;font-weight:800}
/* cheat */
.cheat{columns:2;column-gap:20px}
.cheat .cs{break-inside:avoid;margin:0 0 12px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
.cheat .cs h4{margin:2px 0 4px;font-size:14px;color:var(--acc)}
.cheat pre{margin:0;font-size:12.5px;line-height:1.45;white-space:pre-wrap;background:transparent;border:0;padding:0}
.cheat p{font-size:13px;margin:2px 0}
@media (max-width:860px){
  #menuBtn{display:inline-block}
  nav.side{position:fixed;left:0;top:52px;z-index:35;transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 24px rgba(0,0,0,.15)}
  nav.side.open{transform:none}
  main{padding:16px 16px 100px}
  header.top .brand small{display:none}
  .cols2{grid-template-columns:1fr}
  .cheat{columns:1}
  .hide-m{display:none}
}
@media print{
  header.top,nav.side,#pg,#loading,.navbtm,.noprint{display:none!important}
  main{max-width:none;padding:0}
  body{background:#fff;color:#000;font-size:12px}
  .cheat{columns:2}
  .cheat .cs{border-color:#999}
  h1{font-size:18px}
}

</style>
</head>

<header class="top">

  <button class="btn sm" data-act="reset" title="Kembalikan database kampus ke kondisi awal">↺ <span class="hide-m">Reset database contoh</span></button>
  <button class="btn sm" data-act="theme" title="Ganti mode gelap/terang">◐</button>

  <nav class="side" id="side"></nav>
  <main id="main"></main>

    <p style="font-size:13.5px;color:var(--mut);margin:0 0 6px">Di sini perubahan (INSERT, UPDATE, DROP...) <b>tersimpan</b> selama halaman terbuka. Kalau berantakan, klik Reset DB. Contoh dan latihan di materi selalu jalan di salinan bersih, jadi nggak terpengaruh.</p>
    <div id="pgEd"></div>
    <div class="tbls" id="pgTables"></div>
    <div class="out" id="pgOut"></div>
  </div>
</aside>

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- syntax highlight ---------- */
const SQL_KW = new Set(('SELECT FROM WHERE AND OR NOT IN IS NULL LIKE BETWEEN ORDER BY GROUP HAVING LIMIT OFFSET AS DISTINCT INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE DATABASE SCHEMA DROP ALTER ADD COLUMN MODIFY CHANGE RENAME TO TRUNCATE INDEX VIEW ON PRIMARY KEY FOREIGN REFERENCES UNIQUE DEFAULT CHECK AUTO_INCREMENT AUTOINCREMENT CASCADE JOIN INNER LEFT RIGHT FULL OUTER CROSS NATURAL USING UNION ALL ANY SOME EXISTS CASE WHEN THEN ELSE END WITH RECURSIVE ASC DESC SHOW TABLES DATABASES COLUMNS DESCRIBE USE GRANT REVOKE PRIVILEGES FLUSH USER IDENTIFIED CHARACTER COLLATE IF INT INTEGER BIGINT SMALLINT TINYINT VARCHAR CHAR TEXT DATE DATETIME TIMESTAMP DECIMAL FLOAT DOUBLE ENUM BOOLEAN BOOL UNSIGNED BEGIN COMMIT ROLLBACK TRANSACTION START RESTRICT NO ACTION CONSTRAINT REPLACE TRUE FALSE SEPARATOR AFTER FIRST ENGINE CHARSET EXCEPT INTERSECT OR IGNORE CURRENT_TIMESTAMP OPTION FOR').split(' '));
function highlight(code, lang){
  lang = lang || 'sql';
  const re = /(--[^\n]*|\/\*[\s\S]*?\*\/|(?<![\w$])#[^\n]*)|('(?:[^'\\\n]|\\.|'')*'?|"(?:[^"\\\n]|\\.)*"?|`[^`\n]*`?)|(\$[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(code))) {
    if (m[1] !== undefined) {
      if (lang === 'sql' && m[1][0] === '#') { out += esc(m[1]); continue; }
      out += '<span class="t-cm">' + esc(m[1]) + '</span>';
    }
    else if (m[2] !== undefined) out += '<span class="t-str">' + esc(m[2]) + '</span>';
    else if (m[3] !== undefined) out += '<span class="t-var">' + esc(m[3]) + '</span>';
    else if (m[4] !== undefined) out += '<span class="t-num">' + m[4] + '</span>';
    else if (m[5] !== undefined) {
      const w = m[5];
      if (lang === 'sql' && SQL_KW.has(w.toUpperCase())) out += '<span class="t-kw">' + w + '</span>';
      else if (/^\s*\(/.test(code.slice(re.lastIndex))) out += '<span class="t-fn">' + w + '</span>';
      else if (lang !== 'sql' && /^(mysql|mysqldump|sudo|cd|php|apt|systemctl|define|require_once|unset|global|new|stdClass|function|return)$/.test(w)) out += '<span class="t-kw">' + w + '</span>';
      else out += w;
    } else out += esc(m[6]);
  }
  return out;
}

/* ---------- pecah query jadi per-statement ---------- */
function splitSQL(code){
  const out = []; let cur = '', i = 0, q = null;
  while (i < code.length) {
    const c = code[i], n = code[i+1];
    if (q) {
      cur += c;
      if (c === '\\' && q !== '`') { cur += n || ''; i += 2; continue; }
      if (c === q) { if (n === q) { cur += n; i += 2; continue; } q = null; }
      i++; continue;
    }
    if (c === '-' && n === '-') { const e = code.indexOf('\n', i); const end = e < 0 ? code.length : e; i = end; continue; }
    if (c === '#') { const e = code.indexOf('\n', i); i = e < 0 ? code.length : e; continue; }
    if (c === '/' && n === '*') { const e = code.indexOf('*/', i + 2); i = e < 0 ? code.length : e + 2; continue; }
    if (c === "'" || c === '"' || c === '`') { q = c; cur += c; i++; continue; }
    if (c === ';') { if (cur.trim()) out.push(cur.trim()); cur = ''; i++; continue; }
    cur += c; i++;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

const pad = n => String(n).padStart(2, '0');
function fmtDT(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }

  F('DAY', s => { const d = toDate(s); return d ? d.getDate() : null; });
  F('DAYOFMONTH', s => { const d = toDate(s); return d ? d.getDate() : null; });
  F('HOUR', s => { const d = toDate(s); return d ? d.getHours() : null; });

  id: 'bab2', title: 'Bab 2 · DDL',
  lead: 'DDL (Data Definition Language) = perintah untuk membuat dan mengubah STRUKTUR: database, tabel, kolom, constraint, index, view.',
  intro: `<div class="box"><b>Begini DDL MySQL asli database kampus</b> (bagus untuk dihafal polanya):
${'<pre class="code">' + highlight(`CREATE DATABASE kampus;
USE kampus;

CREATE TABLE dosen (
  id_dosen INT AUTO_INCREMENT PRIMARY KEY,
  nama     VARCHAR(60) NOT NULL,
  keahlian VARCHAR(60)
);

CREATE TABLE mahasiswa (
  nim      VARCHAR(10) PRIMARY KEY,
  nama     VARCHAR(60) NOT NULL,
  jurusan  VARCHAR(40) NOT NULL,
  angkatan INT NOT NULL,
  kota     VARCHAR(30),
  ipk      DECIMAL(3,2) CHECK (ipk BETWEEN 0 AND 4)
);

CREATE TABLE matakuliah (
  kode_mk  VARCHAR(10) PRIMARY KEY,
  nama_mk  VARCHAR(60) NOT NULL,
  sks      INT NOT NULL,
  id_dosen INT,
  FOREIGN KEY (id_dosen) REFERENCES dosen(id_dosen)
    ON DELETE SET NULL ON UPDATE CASCADE
);

CREATE TABLE krs (
  id       INT AUTO_INCREMENT PRIMARY KEY,
  nim      VARCHAR(10) NOT NULL,
  kode_mk  VARCHAR(10) NOT NULL,
  semester INT NOT NULL,
  nilai    INT,
  FOREIGN KEY (nim) REFERENCES mahasiswa(nim),
  FOREIGN KEY (kode_mk) REFERENCES matakuliah(kode_mk)
);`) + '</pre>'}</div>`,
  subs: [
  {
    id: '2.1', t: 'CREATE DATABASE & CREATE TABLE',
    konsep: `<div class="analogi">🏗️ <b>CREATE DATABASE</b> = beli lemari arsip baru yang masih kosong. <b>CREATE TABLE</b> = bikin lembar Excel baru di lemari itu, lengkap dengan judul kolom dan aturan isinya. Datanya belum ada, baru wadahnya.</div>
<p>Urutannya selalu: buat database → <code>USE</code> database → buat tabel. Tabel yang punya FOREIGN KEY harus dibuat <b>setelah</b> tabel yang ditunjuk (dosen dulu, baru matakuliah).</p>`,
    sintaks: { code: `CREATE DATABASE nama_db;

    salah: ['Koma di kolom terakhir: <code>lab VARCHAR(30),</code> lalu <code>);</code> = syntax error.', 'Lupa USE, sehingga tabel dibuat di database yang salah (atau error "No database selected").', 'Membuat tabel anak (punya FK) sebelum tabel induk.', 'Pakai spasi di nama tabel/kolom (<code>nama mahasiswa</code>). Pakai garis bawah: <code>nama_mahasiswa</code>.'],
    latihan: [
      { lv: 'mudah', q: 'Buat tabel <code>lab</code> dengan kolom <code>kode_lab</code> VARCHAR(10) primary key, <code>nama_lab</code> VARCHAR(50) NOT NULL, <code>lantai</code> INT.', a: 'CREATE TABLE lab (\n  kode_lab VARCHAR(10) PRIMARY KEY,\n  nama_lab VARCHAR(50) NOT NULL,\n  lantai INT\n);', check: "SELECT name AS kolom, pk, \"notnull\" FROM pragma_table_info('lab') ORDER BY cid", h: ['CREATE TABLE lab ( ... );', 'NOT NULL ditulis setelah tipe nama_lab.', 'CREATE TABLE lab (kode_lab VARCHAR(10) PRIMARY KEY, nama_lab VARCHAR(50) NOT NULL, lantai INT);'], ex: 'Pengecek melihat nama kolom, mana primary key, dan mana yang NOT NULL.' },
      { lv: 'sedang', q: 'Buat tabel <code>jadwal_praktikum</code>: <code>id</code> INT AUTO_INCREMENT primary key, <code>kode_mk</code> VARCHAR(10) NOT NULL, <code>hari</code> VARCHAR(10), <code>jam_mulai</code> TIME, <code>ruang</code> VARCHAR(20).', a: 'CREATE TABLE jadwal_praktikum (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n  kode_mk VARCHAR(10) NOT NULL,\n  hari VARCHAR(10),\n  jam_mulai TIME,\n  ruang VARCHAR(20)\n);', check: "SELECT name AS kolom, pk, \"notnull\" FROM pragma_table_info('jadwal_praktikum') ORDER BY cid", h: ['TIME adalah tipe untuk jam, formatnya HH:MM:SS.', 'id INT AUTO_INCREMENT PRIMARY KEY', 'Lima kolom, dipisah koma, kolom terakhir tanpa koma.'], ex: 'TIME menyimpan jam (misal 13:00:00). AUTO_INCREMENT membuat id terisi otomatis.' },
      { lv: 'sulit', q: 'Buat <b>dua</b> tabel: <code>kelas</code> (<code>id_kelas</code> INT primary key, <code>nama_kelas</code> VARCHAR(20) NOT NULL) dan <code>anggota_kelas</code> (<code>id_kelas</code> INT, <code>nim</code> VARCHAR(10), dengan FOREIGN KEY id_kelas ke kelas dan nim ke mahasiswa). Pakai IF NOT EXISTS di keduanya.', a: 'CREATE TABLE IF NOT EXISTS kelas (\n  id_kelas INT PRIMARY KEY,\n  nama_kelas VARCHAR(20) NOT NULL\n);\nCREATE TABLE IF NOT EXISTS anggota_kelas (\n  id_kelas INT,\n  nim VARCHAR(10),\n  FOREIGN KEY (id_kelas) REFERENCES kelas(id_kelas),\n  FOREIGN KEY (nim) REFERENCES mahasiswa(nim)\n);', check: "SELECT m.name AS tabel, p.name AS kolom FROM sqlite_master m, pragma_table_info(m.name) p WHERE m.name IN ('kelas','anggota_kelas') UNION ALL SELECT 'FK: ' || f.\"from\", f.\"table\" FROM pragma_foreign_key_list('anggota_kelas') f", h: ['Buat tabel induk (kelas) dulu.', 'FOREIGN KEY (kolom) REFERENCES tabel_induk(kolom_pk) ditulis setelah daftar kolom.', 'Ada 2 FOREIGN KEY di anggota_kelas, dipisah koma.'], ex: 'Pengecek melihat kolom kedua tabel dan dua foreign key di anggota_kelas. Ini pola tabel penghubung N-M (seperti krs).' }
    ],
    ringkas: 'CREATE DATABASE membuat lemari, CREATE TABLE membuat lembar dengan kolom dan tipenya; tambah IF NOT EXISTS supaya aman dijalankan ulang.'

  {
    id: '2.2', t: 'Constraint: PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, DEFAULT, CHECK, AUTO_INCREMENT',
    konsep: `<p><b>Constraint</b> = aturan penjaga data. Seperti satpam yang menolak data aneh masuk.</p>
<table class="cmp"><tr><th>Constraint</th><th>Aturannya</th><th>Analogi</th></tr>
<tr><td>PRIMARY KEY</td><td>Unik + nggak boleh NULL. Satu tabel satu PK.</td><td>NIM</td></tr>
<tr><td>FOREIGN KEY</td><td>Nilainya harus ada di tabel induk.</td><td>NIM di KRS harus NIM yang terdaftar</td></tr>
<tr><td>ON DELETE CASCADE</td><td>Induk dihapus → baris anak ikut terhapus.</td><td>Mahasiswa keluar, semua KRS-nya ikut dibuang</td></tr>
<tr><td>ON UPDATE CASCADE</td><td>PK induk diubah → FK di anak ikut berubah.</td><td>NIM diganti, KRS ikut pakai NIM baru</td></tr>
<tr><td>UNIQUE</td><td>Nggak boleh dobel (tapi boleh NULL).</td><td>Email, nomor HP</td></tr>
<tr><td>NOT NULL</td><td>Wajib diisi.</td><td>Kolom bertanda * di formulir</td></tr>
<tr><td>DEFAULT</td><td>Nilai otomatis kalau nggak diisi.</td><td>Status "aktif" untuk mahasiswa baru</td></tr>
<tr><td>CHECK</td><td>Harus memenuhi syarat.</td><td>IPK antara 0 dan 4</td></tr>
<tr><td>AUTO_INCREMENT</td><td>Angka otomatis naik 1, 2, 3...</td><td>Nomor antrian</td></tr></table>
<p>Pilihan ON DELETE / ON UPDATE lain: <b>RESTRICT</b> / <b>NO ACTION</b> (default: tolak penghapusan kalau masih dipakai) dan <b>SET NULL</b> (FK di anak diubah jadi NULL).</p>`,
    sintaks: { code: `CREATE TABLE akun (
  id     INT AUTO_INCREMENT PRIMARY KEY,
  nim    VARCHAR(10) NOT NULL,
  email  VARCHAR(100) UNIQUE,
  status VARCHAR(10) DEFAULT 'aktif',
  poin   INT CHECK (poin >= 0),
  FOREIGN KEY (nim) REFERENCES mahasiswa(nim)
    ON DELETE CASCADE
    ON UPDATE CASCADE
);
-- Bentuk lain: constraint diberi nama
-- CONSTRAINT fk_akun_mhs FOREIGN KEY (nim) REFERENCES mahasiswa(nim)
-- PRIMARY KEY (kolom1, kolom2)   -- PK gabungan dua kolom`, ket: [['AUTO_INCREMENT', 'hanya untuk kolom angka yang jadi key. Satu tabel maksimal satu.'], ['UNIQUE', 'boleh lebih dari satu kolom UNIQUE di satu tabel.'], ["DEFAULT 'aktif'", 'dipakai kalau kolom status nggak disebut saat INSERT.'], ['CHECK (poin >= 0)', 'data dengan poin negatif ditolak.'], ['ON DELETE CASCADE', 'hapus mahasiswa → akun miliknya ikut hilang.']] },
    mysql: ['SQLite asli menulis auto increment sebagai <code>INTEGER PRIMARY KEY AUTOINCREMENT</code>. Di MySQL: <code>INT AUTO_INCREMENT PRIMARY KEY</code>. Playground menerjemahkan otomatis.', 'CHECK baru benar-benar <b>ditegakkan</b> di MySQL 8.0.16 ke atas. Di MySQL 5.7, CHECK ditulis boleh tapi diabaikan.', 'FOREIGN KEY hanya jalan di storage engine <b>InnoDB</b> (default MySQL sekarang). SQLite butuh <code>PRAGMA foreign_keys = ON</code>; di playground sudah dinyalakan.'],
    contoh: [
      { t: 'AUTO_INCREMENT & DEFAULT', sql: `CREATE TABLE akun (
  id INT AUTO_INCREMENT PRIMARY KEY,
  nim VARCHAR(10) NOT NULL,
  email VARCHAR(100) UNIQUE,
  status VARCHAR(10) DEFAULT 'aktif',
  poin INT CHECK (poin >= 0),
  FOREIGN KEY (nim) REFERENCES mahasiswa(nim) ON DELETE CASCADE ON UPDATE CASCADE
);
INSERT INTO akun (nim, email, poin) VALUES ('2101001', 'andi@kampus.ac.id', 10);
INSERT INTO akun (nim, email, poin) VALUES ('2401012', 'lukman@kampus.ac.id', 0);
SELECT * FROM akun;`, ket: 'Kita nggak mengisi id dan status. id terisi 1 dan 2 (AUTO_INCREMENT), status terisi "aktif" (DEFAULT).' },
      { t: 'UNIQUE menolak duplikat', sql: `CREATE TABLE akun (id INT AUTO_INCREMENT PRIMARY KEY, nim VARCHAR(10) NOT NULL, email VARCHAR(100) UNIQUE);
INSERT INTO akun (nim, email) VALUES ('2101001', 'andi@kampus.ac.id');
INSERT INTO akun (nim, email) VALUES ('2101002', 'andi@kampus.ac.id');`, ket: 'INSERT kedua ditolak karena email sudah dipakai. Di MySQL pesannya: Duplicate entry ... for key \'email\'.', err: true },
      { t: 'FOREIGN KEY menolak data "yatim"', sql: `CREATE TABLE akun (id INT AUTO_INCREMENT PRIMARY KEY, nim VARCHAR(10) NOT NULL,
  FOREIGN KEY (nim) REFERENCES mahasiswa(nim));
INSERT INTO akun (nim) VALUES ('9999999');`, ket: 'NIM 9999999 nggak ada di tabel mahasiswa, jadi ditolak. Di MySQL: Cannot add or update a child row: a foreign key constraint fails.', err: true },
      { t: 'ON DELETE CASCADE', sql: `CREATE TABLE akun (id INT AUTO_INCREMENT PRIMARY KEY, nim VARCHAR(10) NOT NULL,
  FOREIGN KEY (nim) REFERENCES mahasiswa(nim) ON DELETE CASCADE);
INSERT INTO akun (nim) VALUES ('2401012'), ('2401012'), ('2101001');
SELECT COUNT(*) AS akun_lukman_sebelum FROM akun WHERE nim = '2401012';
DELETE FROM mahasiswa WHERE nim = '2401012';
SELECT COUNT(*) AS akun_lukman_sesudah FROM akun WHERE nim = '2401012';`, ket: 'Lukman punya 2 akun. Setelah Lukman dihapus dari mahasiswa, 2 akunnya ikut terhapus otomatis (CASCADE). Akun Andi tetap ada.' },
      { t: 'CHECK', sql: `CREATE TABLE akun (id INT AUTO_INCREMENT PRIMARY KEY, poin INT CHECK (poin >= 0));
INSERT INTO akun (poin) VALUES (5);
INSERT INTO akun (poin) VALUES (-3);`, ket: 'Poin -3 melanggar CHECK (poin >= 0) sehingga ditolak.', err: true }
    ],
    salah: ['Mengira UNIQUE sama dengan PRIMARY KEY. UNIQUE boleh NULL dan boleh lebih dari satu per tabel; PK cuma satu dan nggak boleh NULL.', 'Tipe FK beda dengan tipe PK induk (misal INT vs VARCHAR). Di MySQL ini bikin error saat membuat FK.', 'Menghapus data induk yang masih dipakai tanpa CASCADE, lalu bingung kenapa error "foreign key constraint fails".', 'Memakai AUTO_INCREMENT di kolom VARCHAR. Harus kolom angka.'],
    latihan: [
      { lv: 'mudah', q: "Buat tabel <code>kategori</code> (<code>id</code> INT AUTO_INCREMENT primary key, <code>nama</code> VARCHAR(50) NOT NULL UNIQUE). Lalu masukkan dua kategori: 'Praktikum' dan 'Teori' tanpa mengisi id.", a: "CREATE TABLE kategori (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n  nama VARCHAR(50) NOT NULL UNIQUE\n);\nINSERT INTO kategori (nama) VALUES ('Praktikum'), ('Teori');", check: 'SELECT id, nama FROM kategori', h: ['Constraint bisa ditumpuk: VARCHAR(50) NOT NULL UNIQUE.', 'INSERT hanya menyebut kolom nama.', "INSERT INTO kategori (nama) VALUES ('Praktikum'), ('Teori');"], ex: 'id otomatis 1 dan 2 karena AUTO_INCREMENT.' },
      { lv: 'sedang', q: "Buat tabel <code>nilai_praktikum</code>: <code>id</code> INT AUTO_INCREMENT PK, <code>nim</code> VARCHAR(10) NOT NULL (FK ke mahasiswa), <code>skor</code> INT dengan DEFAULT 0 dan CHECK skor antara 0 sampai 100. Lalu masukkan satu baris untuk nim '2101001' tanpa mengisi skor.", a: "CREATE TABLE nilai_praktikum (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n  nim VARCHAR(10) NOT NULL,\n  skor INT DEFAULT 0 CHECK (skor BETWEEN 0 AND 100),\n  FOREIGN KEY (nim) REFERENCES mahasiswa(nim)\n);\nINSERT INTO nilai_praktikum (nim) VALUES ('2101001');", check: "INSERT OR IGNORE INTO nilai_praktikum (nim, skor) VALUES ('2101002', 150);\nSELECT nim, skor FROM nilai_praktikum", h: ['DEFAULT dan CHECK boleh di kolom yang sama: skor INT DEFAULT 0 CHECK (...).', 'Syaratnya bisa ditulis skor BETWEEN 0 AND 100 atau skor >= 0 AND skor <= 100.', 'FOREIGN KEY (nim) REFERENCES mahasiswa(nim)'], ex: 'Pengecek mencoba memasukkan skor 150. Kalau CHECK kamu benar, data itu ditolak, sehingga hanya tersisa baris 2101001 dengan skor 0.' },
      { lv: 'sulit', q: "Buat tabel <code>presensi</code> (<code>id</code> INT AUTO_INCREMENT PK, <code>nim</code> VARCHAR(10) FK ke mahasiswa yang <b>ikut terhapus</b> kalau mahasiswanya dihapus, <code>tanggal</code> DATE). Masukkan presensi nim '2401013' tanggal '2024-09-02'. Lalu hapus mahasiswa '2401013' dari tabel mahasiswa.", a: "CREATE TABLE presensi (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n  nim VARCHAR(10),\n  tanggal DATE,\n  FOREIGN KEY (nim) REFERENCES mahasiswa(nim) ON DELETE CASCADE\n);\nINSERT INTO presensi (nim, tanggal) VALUES ('2401013', '2024-09-02');\nDELETE FROM mahasiswa WHERE nim = '2401013';", check: "SELECT (SELECT COUNT(*) FROM presensi) AS sisa_presensi, (SELECT COUNT(*) FROM mahasiswa WHERE nim = '2401013') AS mira_masih_ada", h: ['"Ikut terhapus" = ON DELETE CASCADE.', 'Tulis ON DELETE CASCADE setelah REFERENCES mahasiswa(nim).', 'Tiga perintah: CREATE TABLE, INSERT, DELETE.'], ex: 'Tanpa CASCADE, DELETE akan ditolak karena presensi masih menunjuk Mira. Dengan CASCADE, presensinya ikut hilang: sisa 0.' }
    ],
    ringkas: 'Constraint adalah satpam data: PK unik dan wajib, FK wajib ada di induk, UNIQUE anti dobel, NOT NULL wajib isi, DEFAULT isi otomatis, CHECK syarat isi, AUTO_INCREMENT nomor otomatis.'
  },
  {
    id: '2.3', t: 'ALTER TABLE: ADD, MODIFY, CHANGE, DROP COLUMN, RENAME',
    konsep: `<div class="analogi">🔨 ALTER TABLE = <b>renovasi</b> lembar yang sudah ada tanpa membuang isinya: tambah kolom, ganti tipe, ganti nama, hapus kolom.</div>
<table class="cmp"><tr><th>Perintah</th><th>Gunanya</th></tr>
<tr><td>ADD</td><td>Tambah kolom baru</td></tr>
<tr><td>MODIFY</td><td>Ubah tipe/constraint kolom, <b>nama tetap</b></td></tr>
<tr><td>CHANGE</td><td>Ubah <b>nama</b> kolom (dan sekaligus tipenya). Tipe wajib ditulis ulang.</td></tr>
<tr><td>RENAME COLUMN</td><td>Ganti nama kolom saja (MySQL 8.0+)</td></tr>
<tr><td>DROP COLUMN</td><td>Hapus kolom beserta isinya</td></tr>
<tr><td>RENAME TO</td><td>Ganti nama tabel</td></tr></table>`,
    sintaks: { code: `ALTER TABLE dosen ADD email VARCHAR(100);
ALTER TABLE dosen ADD COLUMN no_hp VARCHAR(15) AFTER nama;  -- taruh setelah kolom nama
ALTER TABLE dosen MODIFY keahlian VARCHAR(100) NOT NULL;
ALTER TABLE dosen CHANGE keahlian bidang VARCHAR(100);       -- nama lama, nama baru, tipe
ALTER TABLE dosen RENAME COLUMN bidang TO keahlian;          -- MySQL 8.0+
ALTER TABLE dosen DROP COLUMN no_hp;
ALTER TABLE dosen RENAME TO pengajar;
RENAME TABLE pengajar TO dosen;                              -- cara lain ganti nama tabel`, ket: [['ADD [COLUMN]', 'kata COLUMN boleh ditulis, boleh nggak.'], ['AFTER kolom / FIRST', 'menentukan posisi kolom baru (khas MySQL).'], ['MODIFY kolom tipe', 'tulis definisi lengkap baru. Constraint yang nggak ditulis ulang akan hilang!'], ['CHANGE lama baru tipe', 'ganti nama + tipe sekaligus.']] },
    mysql: ['<b>MODIFY nggak ada di SQLite</b> (SQLite nggak bisa ubah tipe kolom). Di playground, MODIFY hanya ditampilkan pesan, nggak dijalankan. Di MySQL: <code>ALTER TABLE dosen MODIFY keahlian VARCHAR(100) NOT NULL;</code>', 'CHANGE nggak ada di SQLite. Playground menerjemahkannya jadi <code>RENAME COLUMN</code> (tipe barunya diabaikan).', 'AFTER/FIRST diabaikan di playground karena SQLite selalu menaruh kolom baru di paling akhir.'],
    contoh: [
      { sql: 'ALTER TABLE dosen ADD email VARCHAR(100);\nSELECT * FROM dosen;', ket: 'Kolom email muncul di paling kanan. Semua dosen lama isinya NULL di kolom baru itu.', hl: 'null' },
      { sql: 'ALTER TABLE dosen CHANGE keahlian bidang VARCHAR(100);\nDESCRIBE dosen;', ket: 'Kolom keahlian sekarang bernama bidang. Isinya tetap.' },
      { sql: 'ALTER TABLE mahasiswa DROP COLUMN kota;\nALTER TABLE staf RENAME TO pegawai;\nDESCRIBE mahasiswa;\nSHOW TABLES;', ket: 'Kolom kota hilang dari mahasiswa (beserta isinya). Tabel staf berganti nama jadi pegawai.' },
      { sql: 'ALTER TABLE dosen MODIFY keahlian VARCHAR(100) NOT NULL;', ket: 'Di MySQL ini mengubah tipe kolom. Di playground cuma muncul info karena SQLite nggak mendukung.' }
    ],
    salah: ['Pakai MODIFY untuk ganti nama kolom. MODIFY nggak bisa ganti nama; pakai CHANGE atau RENAME COLUMN.', 'Lupa menulis tipe saat CHANGE: <code>CHANGE keahlian bidang</code> saja = error. Harus ada tipenya.', 'MODIFY tanpa menulis ulang NOT NULL/DEFAULT, sehingga constraint lama hilang.', 'DROP COLUMN di tabel produksi tanpa backup. Datanya hilang permanen.'],
    latihan: [
      { lv: 'mudah', q: 'Tambahkan kolom <code>email</code> VARCHAR(100) ke tabel <code>dosen</code>.', a: 'ALTER TABLE dosen ADD email VARCHAR(100);', check: "SELECT name AS kolom FROM pragma_table_info('dosen') ORDER BY cid", h: ['ALTER TABLE nama_tabel ...', 'Kata kuncinya ADD.', 'ALTER TABLE dosen ADD email VARCHAR(100);'], ex: 'Kolom email jadi kolom ke-4 di dosen.' },
      { lv: 'sedang', q: 'Ganti nama kolom <code>kota</code> di tabel mahasiswa jadi <code>kota_asal</code> (tipe VARCHAR(30)).', a: 'ALTER TABLE mahasiswa CHANGE kota kota_asal VARCHAR(30);', check: "SELECT name AS kolom FROM pragma_table_info('mahasiswa') ORDER BY cid", h: ['Ganti nama kolom: CHANGE atau RENAME COLUMN.', 'CHANGE nama_lama nama_baru tipe', 'ALTER TABLE mahasiswa CHANGE kota kota_asal VARCHAR(30);'], ex: 'Bisa juga: ALTER TABLE mahasiswa RENAME COLUMN kota TO kota_asal; (MySQL 8).' },
      { lv: 'sulit', q: 'Lakukan 3 hal pada tabel dosen: tambah kolom <code>no_hp</code> VARCHAR(15), hapus kolom <code>keahlian</code>, lalu ganti nama tabelnya jadi <code>pengajar</code>.', a: 'ALTER TABLE dosen ADD no_hp VARCHAR(15);\nALTER TABLE dosen DROP COLUMN keahlian;\nALTER TABLE dosen RENAME TO pengajar;', check: "SELECT name AS kolom FROM pragma_table_info('pengajar') ORDER BY cid", h: ['Tiga perintah ALTER TABLE terpisah (atau satu ALTER dengan koma).', 'Ganti nama tabel paling akhir, karena setelah itu nama dosen sudah nggak ada.', 'ALTER TABLE dosen RENAME TO pengajar; atau RENAME TABLE dosen TO pengajar;'], ex: 'Urutan penting: kalau RENAME duluan, perintah berikutnya harus pakai nama pengajar.' },
      { lv: 'sulit', type: 'pattern', q: 'Tulis perintah MySQL untuk mengubah tipe kolom <code>nama_mk</code> di tabel matakuliah menjadi VARCHAR(100) NOT NULL (nama kolom tetap).', a: 'ALTER TABLE matakuliah MODIFY nama_mk VARCHAR(100) NOT NULL;', pats: [['^ALTER TABLE matakuliah\\b', 'Diawali ALTER TABLE matakuliah.'], ['\\bMODIFY( COLUMN)? nama_mk VARCHAR\\(100\\)', 'Pakai MODIFY nama_mk VARCHAR(100). (Bisa juga CHANGE nama_mk nama_mk ..., tapi di soal ini pakai MODIFY.)'], ['VARCHAR\\(100\\) NOT NULL', 'Jangan lupa NOT NULL.']], h: ['Nama tetap, tipe berubah = MODIFY.', 'ALTER TABLE matakuliah MODIFY ...', 'ALTER TABLE matakuliah MODIFY nama_mk VARCHAR(100) NOT NULL;'], ex: 'MODIFY menulis ulang definisi kolom. Karena nama nggak berubah, nggak perlu CHANGE.' }
    ],
    ringkas: 'ALTER TABLE = renovasi: ADD tambah kolom, MODIFY ubah tipe, CHANGE ubah nama+tipe, DROP COLUMN hapus kolom, RENAME TO ganti nama tabel.'
  },
  {
    id: '2.4', t: 'DROP vs TRUNCATE vs DELETE',
    konsep: `<div class="analogi">📄 Bayangkan satu lembar daftar hadir.<br><b>DELETE</b> = mencoret beberapa nama (atau semua) satu per satu.<br><b>TRUNCATE</b> = menyobek semua isi, tapi lembar dan judul kolomnya tetap, nomor urut mulai dari 1 lagi.<br><b>DROP</b> = membuang lembarnya ke tempat sampah.</div>
<table class="cmp"><tr><th></th><th>DELETE</th><th>TRUNCATE</th><th>DROP</th></tr>
<tr><td>Kategori</td><td>DML</td><td>DDL</td><td>DDL</td></tr>
<tr><td>Yang hilang</td><td>Baris tertentu / semua baris</td><td>Semua baris</td><td>Tabel + struktur + data</td></tr>
<tr><td>Bisa pakai WHERE?</td><td>Bisa</td><td>Nggak</td><td>Nggak</td></tr>
<tr><td>Struktur tabel</td><td>Tetap</td><td>Tetap</td><td>Hilang</td></tr>
<tr><td>AUTO_INCREMENT</td><td>Lanjut dari angka terakhir</td><td>Reset ke 1</td><td>Hilang bersama tabel</td></tr>
<tr><td>Bisa ROLLBACK?</td><td>Bisa (di dalam transaksi)</td><td>Nggak (auto-commit)</td><td>Nggak</td></tr>
<tr><td>Kecepatan</td><td>Lebih lambat (baris per baris)</td><td>Cepat</td><td>Cepat</td></tr></table>`,
    sintaks: { code: `DELETE FROM krs WHERE nilai IS NULL;  -- hapus sebagian
DELETE FROM krs;                      -- hapus semua baris (struktur tetap)
TRUNCATE TABLE krs;                   -- kosongkan + reset AUTO_INCREMENT
DROP TABLE krs;                       -- buang tabelnya
DROP TABLE IF EXISTS krs;             -- aman kalau tabel sudah nggak ada
DROP DATABASE kampus;                 -- buang seluruh database!`, ket: [['DELETE FROM ... WHERE', 'satu-satunya yang bisa memilih baris.'], ['TRUNCATE TABLE', 'kata TABLE boleh dihilangkan di MySQL.'], ['DROP TABLE IF EXISTS', 'pola umum di script instalasi.']] },
    mysql: ['SQLite nggak punya TRUNCATE. Playground menerjemahkan <code>TRUNCATE TABLE krs</code> jadi <code>DELETE FROM krs</code>. Bedanya: di MySQL, TRUNCATE juga me-reset AUTO_INCREMENT ke 1.'],

const ORDER_FLOW = `<p><b>Urutan kamu MENULIS:</b></p>
<div class="flow"><div class="st"><b>SELECT</b></div><div class="ar">→</div><div class="st"><b>FROM</b></div><div class="ar">→</div><div class="st"><b>WHERE</b></div><div class="ar">→</div><div class="st"><b>GROUP BY</b></div><div class="ar">→</div><div class="st"><b>HAVING</b></div><div class="ar">→</div><div class="st"><b>ORDER BY</b></div><div class="ar">→</div><div class="st"><b>LIMIT</b></div></div>
<p><b>Urutan MySQL MENJALANKAN:</b></p>
<div class="flow">
<div class="st"><span class="n">1</span><b>FROM / JOIN</b><small>ambil tabel, gabungkan</small></div><div class="ar">→</div>
<div class="st"><span class="n">2</span><b>WHERE</b><small>saring baris satu-satu</small></div><div class="ar">→</div>
<div class="st"><span class="n">3</span><b>GROUP BY</b><small>kelompokkan</small></div><div class="ar">→</div>
<div class="st"><span class="n">4</span><b>HAVING</b><small>saring kelompok</small></div><div class="ar">→</div>
<div class="st"><span class="n">5</span><b>SELECT</b><small>pilih kolom, hitung, alias dibuat</small></div><div class="ar">→</div>
<div class="st"><span class="n">6</span><b>ORDER BY</b><small>urutkan</small></div><div class="ar">→</div>
<div class="st"><span class="n">7</span><b>LIMIT</b><small>potong jumlah baris</small></div></div>
<div class="tip">Konsekuensi penting: alias yang dibuat di SELECT (langkah 5) <b>belum ada</b> saat WHERE (langkah 2) dijalankan, jadi nggak bisa dipakai di WHERE. Tapi bisa dipakai di ORDER BY (langkah 6). Fungsi agregat juga belum ada di WHERE, makanya butuh HAVING.</div>`;

<tr><td>BETWEEN a AND b</td><td>di antara a dan b, <b>termasuk</b> a dan b</td><td>Umur 17 sampai 25 tahun</td></tr>

LIMIT 3 OFFSET 3;

<table class="cmp"><tr><th></th><th>WHERE</th><th>HAVING</th></tr>
<tr><td>Menyaring</td><td>baris (sebelum dikelompokkan)</td><td>kelompok (setelah GROUP BY)</td></tr>
<tr><td>Boleh pakai COUNT/AVG/...?</td><td>Nggak</td><td>Boleh</td></tr>
<tr><td>Posisi</td><td>sebelum GROUP BY</td><td>setelah GROUP BY</td></tr>
<tr><td>Contoh</td><td>WHERE angkatan &gt;= 2022</td><td>HAVING COUNT(*) &gt;= 2</td></tr></table>

  {
    id: '4.2', t: 'LEFT JOIN',
    konsep: `<p>LEFT JOIN mengambil <b>semua baris tabel kiri</b> (yang ditulis setelah FROM). Kalau punya pasangan di kanan, ditempel. Kalau nggak, kolom-kolom kanan diisi <b>NULL</b>.</p>

<p>Trik paling penting: <b>LEFT JOIN + WHERE kanan IS NULL</b> = mencari baris kiri yang <b>nggak punya pasangan</b> (mahasiswa yang belum KRS, matkul yang belum diambil).</p>`,
    sintaks: { code: `SELECT a.kolom, b.kolom

SELECT a.kolom
FROM tabel_kiri a
LEFT JOIN tabel_kanan b ON a.kunci = b.kunci
WHERE b.kunci IS NULL;`, ket: [['LEFT JOIN', 'sama dengan LEFT OUTER JOIN.'], ['tabel kiri', 'yang ditulis duluan (setelah FROM). Urutan menentukan hasil!']] },
    contoh: [

      { sql: 'SELECT mhs.nim, mhs.nama, k.kode_mk, k.nilai\nFROM mahasiswa mhs\nLEFT JOIN krs k ON mhs.nim = k.nim;', ket: '19 baris = 15 KRS + 4 mahasiswa tanpa KRS (Kartika, Nanda, Lukman, Mira) yang kode_mk-nya NULL. Perhatikan juga Fitri dan Indra: kode_mk ada tapi nilai NULL, itu karena belum dinilai, bukan karena nggak punya pasangan.', hl: 'null' },

    ],
    viz: [{ type: 'venn', join: 'left' }, '<p style="margin-top:14px"><b>Variasi: LEFT JOIN + WHERE kanan IS NULL</b></p>', { type: 'venn', join: 'leftonly' }],
    salah: ['Menaruh syarat tabel kanan di WHERE: <code>LEFT JOIN krs k ON ... WHERE k.semester = 1</code>. Baris NULL (yang nggak punya KRS) ikut terbuang, jadi hasilnya sama seperti INNER JOIN. Kalau mau tetap menampilkan semua, taruh syaratnya di <b>ON</b>: <code>ON mhs.nim = k.nim AND k.semester = 1</code>.', 'Tertukar kiri-kanan. <code>FROM krs LEFT JOIN mahasiswa</code> beda hasil dengan <code>FROM mahasiswa LEFT JOIN krs</code>.', 'Cek "nggak punya pasangan" pakai kolom yang memang bisa NULL (misal k.nilai). Pakai kolom kunci tabel kanan (k.id atau k.nim).'],
    latihan: [
      { lv: 'mudah', q: 'Tampilkan semua dosen (<code>nama</code>) beserta <code>kode_mk</code> yang mereka ajar. Dosen yang nggak mengajar tetap muncul.', a: 'SELECT d.nama, m.kode_mk\nFROM dosen d\nLEFT JOIN matakuliah m ON d.id_dosen = m.id_dosen;', h: ['Semua dosen = dosen di kiri.', 'FROM dosen d LEFT JOIN matakuliah m', 'ON d.id_dosen = m.id_dosen'], ex: '10 baris: Siti muncul 2×, Hendra dan Maya dengan kode_mk NULL.' },
      { lv: 'sedang', q: 'Tampilkan <code>kode_mk</code> dan <code>nama_mk</code> mata kuliah yang <b>belum pernah diambil</b> mahasiswa mana pun.', a: 'SELECT m.kode_mk, m.nama_mk\nFROM matakuliah m\nLEFT JOIN krs k ON m.kode_mk = k.kode_mk\nWHERE k.id IS NULL;', h: ['Belum pernah diambil = nggak punya pasangan di krs.', 'matakuliah di kiri, krs di kanan.', 'WHERE k.id IS NULL'], ex: 'IF301, IF302, IF303.' },
      { lv: 'sulit', q: 'Tampilkan semua mahasiswa angkatan 2023 (<code>nama</code>) beserta <code>kode_mk</code> KRS <b>semester 1</b> mereka. Mahasiswa yang nggak punya KRS semester 1 <b>tetap muncul</b> dengan kode_mk NULL.', a: 'SELECT mhs.nama, k.kode_mk\nFROM mahasiswa mhs\nLEFT JOIN krs k ON mhs.nim = k.nim AND k.semester = 1\nWHERE mhs.angkatan = 2023;', h: ['Syarat angkatan (tabel kiri) boleh di WHERE.', 'Syarat semester (tabel kanan) harus di ON, bukan WHERE.', 'LEFT JOIN krs k ON mhs.nim = k.nim AND k.semester = 1'], ex: 'Hana, Indra, Joko punya KRS semester 1. Kartika dan Nanda muncul dengan NULL. Kalau syarat semester ditaruh di WHERE, Kartika dan Nanda hilang.' }

    latihan: [

  {
    id: '4.4', t: 'FULL OUTER JOIN (dan simulasinya dengan UNION)',
    konsep: `<p>FULL OUTER JOIN = <b>semua baris dari kedua tabel</b>. Yang punya pasangan digabung; yang nggak punya tetap muncul dengan NULL di sisi lainnya.</p>
<div class="warn"><b>⚠ Di MySQL ditulis begini:</b> MySQL <b>nggak punya</b> FULL OUTER JOIN! Ini sering keluar di tes. Caranya: gabungkan hasil LEFT JOIN dan RIGHT JOIN dengan <b>UNION</b>.</div>
<p><b>UNION</b> = menumpuk hasil dua SELECT jadi satu, sekaligus membuang baris kembar. <b>UNION ALL</b> = menumpuk tanpa membuang yang kembar. Syarat: jumlah kolom dan urutan tipenya harus sama.</p>
<div class="analogi">🧷 Seperti menggabungkan <b>dua daftar tamu</b> jadi satu: UNION mencoret nama yang tertulis dua kali, UNION ALL membiarkan dobel.</div>`,
    sintaks: { code: `-- Simulasi FULL OUTER JOIN di MySQL
SELECT a.kolom, b.kolom
FROM a LEFT JOIN b ON a.kunci = b.kunci
UNION
SELECT a.kolom, b.kolom
FROM a RIGHT JOIN b ON a.kunci = b.kunci;`, ket: [['LEFT JOIN', 'semua kiri (+ pasangan).'], ['RIGHT JOIN', 'semua kanan (+ pasangan).'], ['UNION', 'gabungkan dan buang duplikat (baris yang punya pasangan muncul di dua hasil, jadi perlu dibuang dobelnya).']] },
    mysql: ['SQLite (3.39+) justru punya <code>FULL OUTER JOIN</code>. Jadi di playground kamu bisa menjalankan keduanya, tapi <b>di MySQL hanya versi UNION yang jalan</b>.'],
    contoh: [

      { t: 'hanya untuk perbandingan (nggak jalan di MySQL)', sql: 'SELECT m.kode_mk, m.nama_mk, d.nama AS dosen\nFROM matakuliah m\nFULL OUTER JOIN dosen d ON m.id_dosen = d.id_dosen;', ket: 'Hasilnya sama 12 baris. Tapi ingat, di MySQL perintah ini error.', hl: 'null' },
      { t: 'UNION vs UNION ALL', sql: 'SELECT m.kode_mk, d.nama FROM matakuliah m LEFT JOIN dosen d ON m.id_dosen = d.id_dosen\nUNION ALL\nSELECT m.kode_mk, d.nama FROM matakuliah m RIGHT JOIN dosen d ON m.id_dosen = d.id_dosen;', ket: 'Dengan UNION ALL hasilnya 20 baris, karena 8 pasangan muncul dua kali. Makanya simulasi FULL JOIN pakai UNION.', hl: 'null' }
    ],
    viz: { type: 'venn', join: 'full' },
    salah: ['Menulis FULL OUTER JOIN di MySQL. Error.', 'Pakai UNION ALL untuk simulasi, sehingga baris berpasangan dobel.', 'Jumlah kolom SELECT pertama dan kedua beda: error "The used SELECT statements have a different number of columns".'],
    latihan: [
      { lv: 'mudah', q: 'Dengan cara MySQL (LEFT JOIN + UNION + RIGHT JOIN), tampilkan <code>kode_mk</code> dan nama dosen untuk semua matkul dan semua dosen.', a: 'SELECT m.kode_mk, d.nama\nFROM matakuliah m LEFT JOIN dosen d ON m.id_dosen = d.id_dosen\nUNION\nSELECT m.kode_mk, d.nama\nFROM matakuliah m RIGHT JOIN dosen d ON m.id_dosen = d.id_dosen;', h: ['Tulis LEFT JOIN dulu.', 'Lalu UNION, lalu RIGHT JOIN dengan kolom yang sama.', 'Kolom di kedua SELECT harus sama: m.kode_mk, d.nama.'], ex: '12 baris.' },
      { lv: 'sedang', q: 'Tampilkan hanya baris yang <b>nggak punya pasangan</b> dari kedua sisi: matkul tanpa dosen dan dosen tanpa matkul. Kolom: <code>kode_mk</code>, nama dosen.', a: 'SELECT m.kode_mk, d.nama\nFROM matakuliah m LEFT JOIN dosen d ON m.id_dosen = d.id_dosen\nWHERE d.id_dosen IS NULL\nUNION\nSELECT m.kode_mk, d.nama\nFROM matakuliah m RIGHT JOIN dosen d ON m.id_dosen = d.id_dosen\nWHERE m.kode_mk IS NULL;', h: ['Masing-masing bagian diberi WHERE ... IS NULL.', 'Bagian LEFT: d.id_dosen IS NULL. Bagian RIGHT: m.kode_mk IS NULL.', 'Gabung pakai UNION.'], ex: '4 baris: IF302, IF303, Hendra, Maya.' },
      { lv: 'sulit', q: 'Gabungkan daftar <code>nama</code> dari tabel dosen dan tabel staf jadi satu kolom, <b>tanpa nama dobel</b> (ada orang yang terdaftar di keduanya).', a: 'SELECT nama FROM dosen\nUNION\nSELECT nama FROM staf;', h: ['Menumpuk dua hasil = UNION.', 'Tanpa dobel = UNION (bukan UNION ALL).', 'SELECT nama FROM dosen UNION SELECT nama FROM staf;'], ex: '9 + 9 = 18 nama, tapi 4 orang ada di kedua tabel (Budi Santoso, Siti, Agus, Dewi), jadi hasilnya 14.' }

  {
    id: '4.5', t: 'CROSS JOIN',

<div class="analogi">🍱 Warung punya 3 jenis karbo (nasi, lontong, ketupat) dan 4 lauk. Semua kemungkinan paket = 3 × 4 = 12. Itulah CROSS JOIN.</div>
<p>Jarang dipakai untuk data besar (bisa jutaan baris), tapi berguna untuk membuat kombinasi, misal jadwal semua lab × semua hari.</p>`,
    sintaks: { code: `SELECT a.kolom, b.kolom

    ],
    viz: CROSS_VIZ,

    latihan: [

      { lv: 'sedang', q: 'Tampilkan semua kombinasi <code>nama</code> mahasiswa angkatan 2024 dengan <code>nama_mk</code> matakuliah ber-SKS 2.', a: 'SELECT mhs.nama, m.nama_mk\nFROM mahasiswa mhs\nCROSS JOIN matakuliah m\nWHERE mhs.angkatan = 2024 AND m.sks = 2;', h: ['CROSS JOIN mahasiswa dan matakuliah.', 'Saring pakai WHERE untuk kedua tabel.', 'WHERE mhs.angkatan = 2024 AND m.sks = 2'], ex: '2 mahasiswa × 3 matkul = 6 baris.' },
      { lv: 'sulit', q: "Buat jadwal semua kombinasi dosen yang keahliannya 'Basis Data' dengan hari 'Senin' dan 'Kamis'. Kolom: <code>nama</code>, <code>hari</code>. Tabel hari buat sendiri dengan SELECT ... UNION ALL.", a: "SELECT d.nama, h.hari\nFROM dosen d\nCROSS JOIN (SELECT 'Senin' AS hari UNION ALL SELECT 'Kamis') h\nWHERE d.keahlian = 'Basis Data';", h: ["(SELECT 'Senin' AS hari UNION ALL SELECT 'Kamis') h", 'CROSS JOIN tabel sementara itu dengan dosen.', "WHERE d.keahlian = 'Basis Data'"], ex: '2 dosen × 2 hari = 4 baris.' }

  {

    konsep: `<p>SELF JOIN = tabel di-JOIN dengan <b>dirinya sendiri</b>. Wajib pakai dua alias berbeda, seolah-olah ada dua salinan tabel.</p>

      { sql: 'SELECT s.nama AS staf, a.nama AS atasan\nFROM staf s\nLEFT JOIN staf a ON s.id_atasan = a.id;', ket: 'Dengan LEFT JOIN, Dekan ikut muncul dengan atasan NULL. 9 baris.', hl: 'null' },
      { sql: 'SELECT a.nama AS mhs1, b.nama AS mhs2, a.kota\nFROM mahasiswa a\nJOIN mahasiswa b ON a.kota = b.kota AND a.nim < b.nim;', ket: 'Pasangan mahasiswa yang sekota. a.nim < b.nim mencegah pasangan dengan diri sendiri (Andi-Andi) dan pasangan dobel (Andi-Dian dan Dian-Andi). Hasil 12 pasangan.' }

    latihan: [

  {
    id: '5.4', t: 'ANY dan ALL',
    konsep: `<p>ANY dan ALL membandingkan satu nilai dengan <b>daftar</b> hasil subquery.</p>
<table class="cmp"><tr><th>Bentuk</th><th>Arti</th><th>Sama dengan</th></tr>
<tr><td>&gt; ALL (subquery)</td><td>lebih besar dari <b>semua</b></td><td>&gt; MAX(...)</td></tr>
<tr><td>&lt; ALL (subquery)</td><td>lebih kecil dari semua</td><td>&lt; MIN(...)</td></tr>
<tr><td>&gt; ANY (subquery)</td><td>lebih besar dari <b>minimal satu</b></td><td>&gt; MIN(...)</td></tr>
<tr><td>&lt; ANY (subquery)</td><td>lebih kecil dari minimal satu</td><td>&lt; MAX(...)</td></tr>
<tr><td>= ANY (subquery)</td><td>sama dengan salah satu</td><td>IN (...)</td></tr></table>
<div class="analogi">🏃 "Lari lebih cepat dari <b>SEMUA</b> peserta" = harus mengalahkan yang tercepat. "Lebih cepat dari <b>SALAH SATU</b> peserta" = cukup mengalahkan yang paling lambat. SOME = sinonim ANY.</div>`,
    sintaks: { code: `SELECT kolom FROM tabel
WHERE kolom > ALL (SELECT kolom FROM tabel WHERE ...);
SELECT kolom FROM tabel
WHERE kolom > ANY (SELECT kolom FROM tabel WHERE ...);`, ket: [['ALL', 'harus benar untuk semua nilai di daftar.'], ['ANY / SOME', 'cukup benar untuk satu nilai.']] },
    mysql: ['SQLite <b>nggak punya</b> ANY/ALL. Playground menerjemahkan otomatis: <code>&gt; ALL (SELECT x ...)</code> jadi <code>&gt; (SELECT MAX(x) ...)</code>, <code>&gt; ANY</code> jadi <code>&gt; (SELECT MIN(x) ...)</code>, dan seterusnya. Di MySQL, tulis versi ANY/ALL aslinya.'],
    contoh: [
      { sql: "SELECT nama, ipk FROM mahasiswa\nWHERE jurusan = 'Teknik Informatika'\n  AND ipk > ALL (SELECT ipk FROM mahasiswa WHERE jurusan = 'Teknik Komputer');", ket: 'IPK TK: 2.65, 3.05, 3.20, 2.95. Harus lebih besar dari SEMUANYA (jadi > 3.20). Mahasiswa TI yang lolos: Andi, Fitri, Kartika.' },
      { sql: "SELECT nama, ipk FROM mahasiswa\nWHERE jurusan = 'Teknik Informatika'\n  AND ipk > ANY (SELECT ipk FROM mahasiswa WHERE jurusan = 'Teknik Komputer');", ket: 'Cukup lebih besar dari SALAH SATU (yang terkecil 2.65). Budi (2.90) ikut lolos. Indra (2.40) nggak.' },
      { sql: "SELECT nama, ipk FROM mahasiswa\nWHERE jurusan = 'Teknik Informatika'\n  AND ipk > (SELECT MAX(ipk) FROM mahasiswa WHERE jurusan = 'Teknik Komputer');", ket: 'Versi MAX dari contoh 1. Hasilnya sama persis.' }
    ],
    salah: ['Tertukar ANY dan ALL.', 'Jebakan NULL di ALL: kalau daftar subquery berisi NULL, di MySQL <code>&gt; ALL</code> menghasilkan kosong. Contoh: IPK jurusan SI ada yang NULL (Lukman). Tambahkan <code>WHERE ipk IS NOT NULL</code> di subquery. (Di playground efek ini nggak terlihat karena diterjemahkan ke MAX yang mengabaikan NULL.)', 'Subquery ALL/ANY menghasilkan lebih dari 1 kolom.'],
    latihan: [
      { lv: 'mudah', q: 'Tampilkan <code>kode_mk</code> dan <code>sks</code> matakuliah yang SKS-nya lebih besar dari SKS <b>semua</b> matkul yang belum punya dosen. Pakai ALL.', a: 'SELECT kode_mk, sks FROM matakuliah\nWHERE sks > ALL (SELECT sks FROM matakuliah WHERE id_dosen IS NULL);', h: ['Daftar: SKS matkul tanpa dosen (id_dosen IS NULL).', '> ALL (subquery)', 'Matkul tanpa dosen SKS-nya 2 dan 2.'], ex: 'Semua matkul yang SKS-nya > 2: 7 matkul.' },
      { lv: 'sedang', q: 'Tampilkan <code>id</code> dan <code>nilai</code> KRS yang nilainya lebih tinggi dari <b>semua</b> nilai KRS semester 2.', a: 'SELECT id, nilai FROM krs\nWHERE nilai > ALL (SELECT nilai FROM krs WHERE semester = 2);', h: ['Nilai semester 2: 75, 60, 70.', '> ALL berarti harus > 75.', 'WHERE nilai > ALL (SELECT nilai FROM krs WHERE semester = 2)'], ex: '7 KRS: nilai 78, 82, 85, 88, 90, 92, 95.' },
      { lv: 'sulit', q: "Tampilkan nama dan ipk mahasiswa <b>Sistem Informasi</b> yang IPK-nya lebih rendah dari <b>salah satu</b> mahasiswa Teknik Informatika angkatan 2021. Pakai ANY.", a: "SELECT nama, ipk FROM mahasiswa\nWHERE jurusan = 'Sistem Informasi'\n  AND ipk < ANY (SELECT ipk FROM mahasiswa WHERE jurusan = 'Teknik Informatika' AND angkatan = 2021);", h: ['Daftar: IPK TI angkatan 2021 = 3.45 dan 2.90.', '< ANY berarti cukup lebih kecil dari yang terbesar (3.45).', "WHERE jurusan = 'Sistem Informasi' AND ipk < ANY (...)"], ex: 'Hanya Dian (3.12). Citra 3.78 dan Hana 3.55 lebih besar dari 3.45; Lukman NULL.' }

    ringkas: '> ALL artinya lebih besar dari semuanya (setara > MAX), > ANY artinya lebih besar dari salah satu (setara > MIN).'

    salah: ['Lupa alias untuk derived table (error di MySQL).', 'Memakai kolom yang nggak dipilih di dalam derived table.', 'Lupa memberi alias pada kolom agregat di dalam (<code>COUNT(*)</code> tanpa AS), sehingga susah dipanggil di luar.'],
    latihan: [

      { lv: 'sedang', q: 'Berapa rata-rata nilai <b>tertinggi</b> di antara semua matkul? (Hitung rata-rata nilai per kode_mk dulu, lalu ambil maksimumnya.) Satu angka.', a: 'SELECT MAX(rata) AS rata_tertinggi\nFROM (SELECT kode_mk, AVG(nilai) AS rata FROM krs GROUP BY kode_mk) AS t;', h: ['Dalam: AVG(nilai) per kode_mk.', 'Luar: MAX dari kolom rata.', 'Agregat di atas agregat butuh derived table.'], ex: '88 (IF204 Statistika, satu-satunya nilai 88).' },

  WHERE m2.jurusan = m.jurusan            -- "nyontek" baris luar

<tr><td>mdl_role_assignments</td><td>user X punya peran Y di konteks Z</td><td>id, roleid, contextid, userid</td></tr>

    id: '7.5', t: 'Latihan query nyata di database Moodle',
    konsep: `<p>Ini jenis pertanyaan yang biasa diminta dosen/admin ke asisten lab: "Siapa saja peserta course X?", "Berapa peserta tiap course?", "Siapa yang belum pernah login?", "Rata-rata nilai akhir per course?". Semua memakai JOIN, subquery, dan CTE dari bab sebelumnya.</p>`,
    sintaks: { code: `-- Peserta suatu course

WHERE c.shortname = 'BD101';`, ket: [['c.shortname', 'kode singkat course, unik.']] },
    contoh: [
      { sql: "SELECT u.username, CONCAT(u.firstname, ' ', u.lastname) AS nama_lengkap, e.enrol AS lewat\nFROM mdl_user u\nJOIN mdl_user_enrolments ue ON ue.userid = u.id\nJOIN mdl_enrol e ON e.id = ue.enrolid\nJOIN mdl_course c ON c.id = e.courseid\nWHERE c.shortname = 'BD101';", ket: '7 peserta Basis Data. gilang masuk lewat self-enrol, sisanya manual. Dosennya (budi.dosen) juga ter-enrol, karena di Moodle dosen pun harus terdaftar di course.' },
      { sql: 'SELECT c.fullname, COUNT(ue.id) AS jumlah_peserta\nFROM mdl_course c\nLEFT JOIN mdl_enrol e ON e.courseid = c.id\nLEFT JOIN mdl_user_enrolments ue ON ue.enrolid = e.id\nGROUP BY c.id, c.fullname\nORDER BY jumlah_peserta DESC;', ket: 'LEFT JOIN supaya course tanpa peserta (Kecerdasan Buatan) tetap muncul dengan 0. COUNT(ue.id), bukan COUNT(*).' },
      { sql: "SELECT c.shortname, u.username, r.shortname AS peran\nFROM mdl_role_assignments ra\nJOIN mdl_role r ON r.id = ra.roleid\nJOIN mdl_context x ON x.id = ra.contextid AND x.contextlevel = 50\nJOIN mdl_course c ON c.id = x.instanceid\nJOIN mdl_user u ON u.id = ra.userid\nWHERE r.shortname = 'editingteacher';", ket: 'Dosen (role editingteacher) di tiap course lewat rantai peran.' },
      { sql: "WITH nilai_akhir AS (\n  SELECT gi.courseid, gg.userid, gg.finalgrade\n  FROM mdl_grade_grades gg\n  JOIN mdl_grade_items gi ON gi.id = gg.itemid\n  WHERE gi.itemtype = 'course'\n)\nSELECT c.fullname, COUNT(na.finalgrade) AS sudah_dinilai, ROUND(AVG(na.finalgrade), 2) AS rata\nFROM nilai_akhir na JOIN mdl_course c ON c.id = na.courseid\nGROUP BY c.id, c.fullname;", ket: 'CTE mengambil nilai akhir course (itemtype = \'course\'), lalu dirata-rata. Nilai NULL (belum dinilai) nggak ikut dihitung.' }

    salah: ['Menghitung peserta pakai COUNT(*) dengan LEFT JOIN (course kosong jadi 1).', 'Lupa bahwa satu user bisa terdaftar lewat dua metode (manual dan self) di course yang sama sehingga terhitung dua kali. Pakai COUNT(DISTINCT ue.userid) kalau perlu.', 'Mencari dosen dari mdl_user_enrolments. Enrol nggak menyimpan peran; peran ada di mdl_role_assignments.'],
    latihan: [
      { lv: 'mudah', q: "Tampilkan <code>username</code> dan nama lengkap (kolom <code>nama</code>, gabungan firstname + spasi + lastname) semua peserta course dengan shortname <code>'PW102'</code>.", a: "SELECT u.username, CONCAT(u.firstname, ' ', u.lastname) AS nama\nFROM mdl_user u\nJOIN mdl_user_enrolments ue ON ue.userid = u.id\nJOIN mdl_enrol e ON e.id = ue.enrolid\nJOIN mdl_course c ON c.id = e.courseid\nWHERE c.shortname = 'PW102';", h: ['Rantai: user → user_enrolments → enrol → course.', "CONCAT(u.firstname, ' ', u.lastname)", "WHERE c.shortname = 'PW102'"], ex: 'siti.dosen, andi, fitri, hana.' },
      { lv: 'sedang', q: 'Tampilkan <code>fullname</code> setiap course dan jumlah pesertanya (kolom <code>jumlah</code>), <b>termasuk</b> course yang belum punya peserta.', a: 'SELECT c.fullname, COUNT(ue.id) AS jumlah\nFROM mdl_course c\nLEFT JOIN mdl_enrol e ON e.courseid = c.id\nLEFT JOIN mdl_user_enrolments ue ON ue.enrolid = e.id\nGROUP BY c.id, c.fullname;', h: ['Termasuk yang kosong = LEFT JOIN dari mdl_course.', 'Dua LEFT JOIN: ke enrol lalu ke user_enrolments.', 'COUNT(ue.id), bukan COUNT(*).'], ex: 'Basis Data 7, Pemrograman Web 4, Analisis Sistem 4, Bahasa Inggris 3, Kecerdasan Buatan 0.' },
      { lv: 'sedang', q: "Tampilkan <code>username</code> user yang <b>nggak terdaftar</b> di course mana pun, selain 'guest' dan 'admin'.", a: "SELECT username FROM mdl_user u\nWHERE NOT EXISTS (SELECT 1 FROM mdl_user_enrolments ue WHERE ue.userid = u.id)\n  AND username NOT IN ('guest', 'admin');", h: ['Nggak punya pasangan di mdl_user_enrolments.', 'NOT EXISTS atau LEFT JOIN ... IS NULL.', "AND username NOT IN ('guest','admin')"], ex: 'Hanya joko.' },
      { lv: 'sulit', q: "Tampilkan <code>username</code> dan <code>shortname</code> course untuk semua user ber-peran <b>student</b> yang <b>belum pernah login</b>.", a: "SELECT u.username, c.shortname\nFROM mdl_role_assignments ra\nJOIN mdl_role r ON r.id = ra.roleid\nJOIN mdl_context x ON x.id = ra.contextid AND x.contextlevel = 50\nJOIN mdl_course c ON c.id = x.instanceid\nJOIN mdl_user u ON u.id = ra.userid\nWHERE r.shortname = 'student' AND u.lastlogin = 0;", h: ['Peran ada di mdl_role_assignments + mdl_role.', 'Context level 50 menghubungkan ke course lewat instanceid.', "WHERE r.shortname = 'student' AND u.lastlogin = 0"], ex: 'hana (PW102) dan indra (AS201). Mereka sudah didaftarkan tapi belum pernah membuka Moodle.' },
      { lv: 'sulit', q: "Pakai CTE: hitung rata-rata nilai akhir course (grade item dengan itemtype 'course', abaikan NULL). Tampilkan <code>fullname</code> course dan rata-ratanya (kolom <code>rata</code>).", a: "WITH nilai_akhir AS (\n  SELECT gi.courseid, gg.finalgrade\n  FROM mdl_grade_grades gg\n  JOIN mdl_grade_items gi ON gi.id = gg.itemid\n  WHERE gi.itemtype = 'course'\n)\nSELECT c.fullname, AVG(na.finalgrade) AS rata\nFROM nilai_akhir na\nJOIN mdl_course c ON c.id = na.courseid\nGROUP BY c.id, c.fullname;", h: ["CTE: grade_grades JOIN grade_items WHERE itemtype = 'course'.", 'Query utama: JOIN ke mdl_course, GROUP BY course.', 'AVG otomatis mengabaikan NULL.'], ex: 'Basis Data 79.9, Pemrograman Web 84, Analisis Sistem 75.' },
      { lv: 'sulit', q: "Tampilkan <code>fullname</code> course dan <code>firstname</code> dosennya (role 'editingteacher').", a: "SELECT c.fullname, u.firstname\nFROM mdl_role_assignments ra\nJOIN mdl_role r ON r.id = ra.roleid\nJOIN mdl_context x ON x.id = ra.contextid AND x.contextlevel = 50\nJOIN mdl_course c ON c.id = x.instanceid\nJOIN mdl_user u ON u.id = ra.userid\nWHERE r.shortname = 'editingteacher';", h: ['Sama seperti contoh 3.', "Saring r.shortname = 'editingteacher'.", 'Ambil c.fullname dan u.firstname.'], ex: 'Basis Data: Budi, Pemrograman Web: Siti, Analisis Sistem: Budi.' }
    ],
    ringkas: 'Query Moodle sehari-hari = JOIN rantai enrol untuk peserta, rantai role_assignments + context untuk peran, dan grade_items + grade_grades untuk nilai.'

  {
    id: '7.6', t: 'Masalah umum & backup/restore dengan mysqldump',
    konsep: `<table class="cmp"><tr><th>Gejala</th><th>Penyebab umum</th><th>Solusi</th></tr>
<tr><td>"Database connection failed" / Error reading from database</td><td>Service MySQL mati; dbhost/dbname/dbuser/dbpass di config.php salah; port bentrok</td><td>Start MySQL di XAMPP; cocokkan config.php; cek port 3306</td></tr>
<tr><td>"Access denied for user 'moodleuser'@'localhost'"</td><td>Password salah, user belum dibuat, atau host beda (localhost vs 127.0.0.1 vs %)</td><td>CREATE USER / ALTER USER ... IDENTIFIED BY, cek host user</td></tr>
<tr><td>"... command denied to user" (misal CREATE/ALTER denied saat upgrade)</td><td>Privilege kurang</td><td>GRANT hak yang kurang (CREATE, ALTER, INDEX, DROP) ON moodle.*</td></tr>
<tr><td>Peringatan charset / "Incorrect string value" saat ada emoji</td><td>Database/tabel masih utf8 (mb3) atau latin1</td><td>Ubah ke utf8mb4: <code>ALTER DATABASE moodle CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;</code> lalu jalankan <code>php admin/cli/mysql_collation.php --collation=utf8mb4_unicode_ci</code></td></tr>
<tr><td>"Table 'moodle.mdl_config' doesn't exist"</td><td>Prefix salah atau database belum terinstal/terisi</td><td>Cek $CFG->prefix dan $CFG->dbname</td></tr>
<tr><td>Installer menolak "max_input_vars"</td><td>Setting PHP</td><td>Set max_input_vars = 5000 di php.ini, restart Apache</td></tr></table>
<p><b>Backup</b> Moodle = backup <b>database</b> + backup folder <b>moodledata</b> (+ config.php). Database dibackup dengan <b>mysqldump</b>, program terminal yang menulis seluruh isi database jadi file .sql berisi perintah CREATE TABLE dan INSERT.</p>
<div class="analogi">📸 mysqldump = <b>memfotokopi seluruh lemari arsip</b> jadi satu bundel. Restore = memasukkan kembali isi bundel itu ke lemari kosong.</div>`,
    sintaks: { lang: 'bash', code: `# Backup (dijalankan di terminal, BUKAN di dalam mysql>)
mysqldump -u root -p moodle > backup_moodle.sql
mysqldump -u root -p --single-transaction moodle > backup_moodle.sql   # aman untuk InnoDB tanpa mengunci tabel
mysqldump -u root -p --all-databases > semua.sql

# Restore: buat database kosong dulu, lalu
mysql -u root -p -e "CREATE DATABASE moodle DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
mysql -u root -p moodle < backup_moodle.sql

# Atau dari dalam mysql>
# USE moodle;
# SOURCE backup_moodle.sql;

# Saran: aktifkan maintenance mode dulu supaya data nggak berubah saat backup
php admin/cli/maintenance.php --enable`, ket: [['>', 'arah output: tulis hasil ke file (backup).'], ['<', 'arah input: baca file ke mysql (restore).'], ['--single-transaction', 'snapshot konsisten tanpa mengunci tabel InnoDB.'], ['SOURCE file.sql', 'cara restore dari dalam prompt mysql>.']] },
    contoh: [
      { sql: "SELECT DATABASE() AS database_aktif, VERSION() AS versi;\nSHOW TABLES LIKE 'mdl_user%';", ket: 'Saat troubleshooting, cek dulu kamu sedang di database mana dan versi MySQL-nya (CTE butuh 8.0).' },
      { sql: "SHOW GRANTS FOR 'moodleuser'@'localhost';\nALTER USER 'moodleuser'@'localhost' IDENTIFIED BY 'PasswordBaru!';", ket: 'Cek dan perbaiki hak akses/password. Setelah ALTER USER, jangan lupa ubah $CFG->dbpass di config.php.' }
    ],
    salah: ['Menjalankan mysqldump di dalam prompt <code>mysql&gt;</code>. mysqldump adalah program terpisah, dijalankan di terminal biasa.', 'Tanda panah terbalik: <code>mysqldump ... &lt; file.sql</code>. Backup pakai &gt;, restore pakai &lt;.', 'Restore ke database yang belum dibuat (error "Unknown database").', 'Hanya backup database tanpa moodledata. File tugas dan gambar akan hilang.'],
    latihan: [
      { lv: 'mudah', type: 'pattern', q: 'Tulis perintah terminal untuk mem-backup database <code>moodle</code> ke file <code>backup.sql</code> memakai user root (diminta password).', a: 'mysqldump -u root -p moodle > backup.sql', pats: [['^mysqldump\\b', 'Programnya mysqldump.'], ['-u\\s*root\\b', 'User: -u root'], ['(^|\\s)-p(\\s|$)', 'Tambahkan -p supaya diminta password.'], ['\\bmoodle\\s*>\\s*backup\\.sql', 'Akhiri dengan: moodle > backup.sql']], h: ['Program backup MySQL: mysqldump.', 'Formatnya: mysqldump -u user -p nama_db > file.sql', 'mysqldump -u root -p moodle > backup.sql'], ex: 'Tanda > mengalirkan hasil dump ke file.' },
      { lv: 'sedang', type: 'pattern', q: 'Tulis perintah terminal untuk me-restore file <code>backup.sql</code> ke database <code>moodle</code> (sudah dibuat) memakai user root.', a: 'mysql -u root -p moodle < backup.sql', pats: [['^mysql\\b', 'Restore memakai program mysql (bukan mysqldump).'], ['-u\\s*root\\b', 'User: -u root'], ['(^|\\s)-p(\\s|$)', 'Tambahkan -p.'], ['\\bmoodle\\s*<\\s*backup\\.sql', 'Akhiri dengan: moodle < backup.sql']], h: ['Restore pakai program mysql.', 'Tanda panahnya kebalikan backup.', 'mysql -u root -p moodle < backup.sql'], ex: 'Tanda < memasukkan isi file sebagai input ke mysql.' },
      { lv: 'sulit', type: 'mc', q: "Moodle menampilkan error: <code>Access denied for user 'moodleuser'@'localhost' (using password: YES)</code>. Penyebab paling mungkin?", opsi: ['Folder moodledata penuh', 'Password di config.php salah, atau user moodleuser@localhost belum dibuat/diberi hak', 'Prefix tabel salah', 'Character set belum utf8mb4'], benar: 1, h: ['"Access denied" = MySQL menolak login.'], ex: 'MySQL menolak login user tersebut. Cek dbpass di config.php, keberadaan user, dan host-nya.' },
      { lv: 'sulit', type: 'mc', q: 'Kenapa database Moodle sebaiknya memakai <code>utf8mb4</code>, bukan <code>utf8</code>?', opsi: ['Supaya lebih cepat', 'Karena utf8 di MySQL hanya 3 byte per karakter sehingga emoji dan sebagian karakter nggak bisa disimpan', 'Karena utf8 nggak mendukung huruf Latin', 'Karena utf8mb4 lebih hemat tempat'], benar: 1, h: ['Emoji butuh 4 byte.'], ex: 'utf8 di MySQL = utf8mb3 (maks 3 byte). utf8mb4 mendukung semua karakter Unicode termasuk emoji.' }
    ],
    ringkas: 'Masalah Moodle-database biasanya soal koneksi (config.php), privilege, charset, atau prefix, dan backup/restore dilakukan dengan mysqldump > file.sql dan mysql < file.sql plus salinan moodledata.'
  }

  { bab: 'Bab 0 Pengenalan', type: 'mc', q: 'Kolom yang nilainya unik dan nggak boleh NULL, dipakai untuk mengidentifikasi setiap baris, disebut...', opsi: ['Foreign key', 'Primary key', 'Index', 'Default'], benar: 1, ex: 'Primary key = unik + NOT NULL.' },

  { bab: 'Bab 1 MySQL Dasar', type: 'mc', q: 'Perintah MySQL untuk melihat struktur kolom tabel mahasiswa adalah...', opsi: ['SHOW mahasiswa;', 'DESCRIBE mahasiswa;', 'SELECT STRUCTURE mahasiswa;', 'USE mahasiswa;'], benar: 1, ex: 'DESCRIBE (atau DESC, atau SHOW COLUMNS FROM) menampilkan struktur tabel.' },

  { bab: 'Bab 2 DDL', type: 'mc', q: 'Untuk mengganti NAMA kolom keahlian menjadi bidang di MySQL, perintah yang benar...', opsi: ['ALTER TABLE dosen MODIFY keahlian bidang VARCHAR(60);', 'ALTER TABLE dosen CHANGE keahlian bidang VARCHAR(60);', 'UPDATE dosen SET keahlian = bidang;', 'RENAME TABLE keahlian TO bidang;'], benar: 1, ex: 'CHANGE nama_lama nama_baru tipe. MODIFY hanya mengubah tipe. (MySQL 8 juga punya RENAME COLUMN.)' },
  { bab: 'Bab 2 DDL', type: 'query', q: 'Buat tabel <code>sertifikat</code>: <code>id</code> INT AUTO_INCREMENT primary key, <code>nim</code> VARCHAR(10) NOT NULL (FK ke mahasiswa), <code>judul</code> VARCHAR(100) NOT NULL. Lalu tambahkan sertifikat \'Asisten Basis Data\' untuk nim \'2201006\'.', a: "CREATE TABLE sertifikat (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n  nim VARCHAR(10) NOT NULL,\n  judul VARCHAR(100) NOT NULL,\n  FOREIGN KEY (nim) REFERENCES mahasiswa(nim)\n);\nINSERT INTO sertifikat (nim, judul) VALUES ('2201006', 'Asisten Basis Data');", check: "SELECT id, nim, judul FROM sertifikat UNION ALL SELECT 'FK', f.\"from\", f.\"table\" FROM pragma_foreign_key_list('sertifikat') f", ex: 'Dicek: isi tabel (id otomatis 1) dan keberadaan foreign key nim ke mahasiswa.' },
  { bab: 'Bab 2 DDL', type: 'query', q: 'Tambahkan kolom <code>email</code> VARCHAR(100) ke tabel mahasiswa, lalu buat view <code>v_mhs_medan</code> berisi nim dan nama mahasiswa dari kota Medan.', a: "ALTER TABLE mahasiswa ADD email VARCHAR(100);\nCREATE VIEW v_mhs_medan AS SELECT nim, nama FROM mahasiswa WHERE kota = 'Medan';", check: "SELECT name, NULL FROM pragma_table_info('mahasiswa') UNION ALL SELECT nim, nama FROM v_mhs_medan", ex: 'ALTER TABLE ... ADD, lalu CREATE VIEW ... AS SELECT.' },

  'https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/',

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
const READY = (async () => {
  for (const base of SQLJS_BASES) {
    try {
      if (typeof initSqlJs === 'undefined') await loadScript(base + 'sql-wasm.js');

})();

/* ---------- komponen ---------- */
function codeBlock(code, lang){ return `<pre class="code">${highlight(code.trim(), lang)}</pre>`; }
function editor(id, code){ return `<div class="ed"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" data-ed="${id}">${esc(code || '')}</textarea></div>`; }
function syncEd(ta){ ta.previousElementSibling.innerHTML = highlight(ta.value) + '\n '; }
function fmtCell(v){
  if (v === null || v === undefined) return '<td class="null">NULL</td>';
  if (typeof v === 'number' && !Number.isInteger(v)) v = Math.round(v * 10000) / 10000;
  return `<td>${esc(v)}</td>`;
}
function tableHTML(res, opts){
  opts = opts || {};
  const max = 300; const rows = res.values.slice(0, max);
  let h = `<div class="tblwrap"><table class="data"><tr>${res.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`;
  for (const r of rows) {
    const cls = opts.hl === 'null' && r.some(v => v === null) ? ' class="hl"' : '';
    h += `<tr${cls}>${r.map(fmtCell).join('')}</tr>`;
  }
  h += '</table></div>';
  h += `<div class="cap">${res.values.length} baris${res.values.length > max ? ` (ditampilkan ${max})` : ''}${opts.hl === 'null' && res.values.some(r => r.some(v => v === null)) ? ' · <span style="background:var(--nullbg);padding:0 4px">baris kuning</span> = ada NULL (nggak punya pasangan / belum diisi)' : ''}</div>`;
  return h;
}
function runHTML(r, opts){
  let h = '';
  const steps = r.steps;
  const many = steps.length > 1;
  steps.forEach((s, i) => {
    if (s.kind === 'info') { h += `<div class="msg info">ℹ ${esc(s.text)}</div>`; return; }
    if (s.translated) h += `<div class="tr">ℹ Diterjemahkan ke SQLite: <code>${esc(s.translated.length > 160 ? s.translated.slice(0, 160) + '…' : s.translated)}</code></div>`;
    if (s.note) h += `<div class="msg info">ℹ ${esc(s.note)}</div>`;
    if (s.result) h += tableHTML(s.result, opts);
    else if (many || !r.error) {
      const verb = /^\s*(INSERT|REPLACE)/i.test(s.orig) ? 'ditambahkan' : /^\s*UPDATE/i.test(s.orig) ? 'diubah' : /^\s*(DELETE|TRUNCATE)/i.test(s.orig) ? 'dihapus' : null;
      h += `<div class="msg ok">✓ ${esc(s.orig.split(/\s+/).slice(0, 3).join(' '))}… berhasil${verb ? `, ${s.changes} baris ${verb}` : ''}.</div>`;
    }
  });
  if (r.error) h += `<div class="msg err">✗ Error: ${esc(r.error.msg)}${r.error.hint ? `<br>💡 ${esc(r.error.hint)}` : ''}</div>`;
  return h;
}
function needEngine(out){ if (ENGINE_OK) return true; out.innerHTML = '<div class="msg info">Mesin SQL masih dimuat, tunggu sebentar...</div>'; return false; }

  else if (type === 'left') fill = `<circle cx="80" cy="70" r="52" ${f}/>`;
  else if (type === 'right') fill = `<circle cx="140" cy="70" r="52" ${f}/>`;
  else if (type === 'full') fill = `<circle cx="80" cy="70" r="52" ${f}/><circle cx="140" cy="70" r="52" ${f}/>`;
  else if (type === 'leftonly') fill = `<clipPath id="${id}"><circle cx="80" cy="70" r="52"/></clipPath><circle cx="80" cy="70" r="52" ${f}/><circle cx="140" cy="70" r="52" fill="var(--card)" clip-path="url(#${id})"/>`;

}
const VENN_TXT = {
  inner: 'Cuma bagian <b>irisan</b>: matkul yang punya dosen DAN dosen yang punya matkul.',
  left: 'Semua dari tabel <b>kiri</b> (matakuliah). Kalau nggak punya pasangan, kolom dosen diisi NULL.',
  right: 'Semua dari tabel <b>kanan</b> (dosen). Dosen yang nggak ngajar tetap muncul, kolom matkul NULL.',
  full: 'Semua dari <b>kedua</b> tabel. Yang nggak punya pasangan tetap muncul dengan NULL di sisi lain.',
  leftonly: 'Hanya baris kiri yang <b>nggak</b> punya pasangan (LEFT JOIN + WHERE kanan IS NULL).'

function vizHTML(v){
  if (!v) return '';

  if (Array.isArray(v)) return v.map(vizHTML).join('');

}
function fillViz(){
  if (!ENGINE_OK) return;
  $$('[data-viz="joinlist"]').forEach(el => {
    if (el.dataset.done) return; el.dataset.done = 1;
    const db = freshDB();
    const L = db.exec('SELECT kode_mk, nama_mk, id_dosen FROM matakuliah')[0].values;
    const R = db.exec('SELECT id_dosen, nama FROM dosen')[0].values; db.close();
    const rIds = new Set(R.map(r => r[0])), lIds = new Set(L.map(r => r[2]));
    const t = el.dataset.join;
    const keepL = t === 'left' || t === 'full', keepR = t === 'right' || t === 'full';
    const cls = (matched, keep) => matched ? 'in' : (keep ? 'hl' : 'gone');
    const lt = `<table class="data"><tr><th>kode_mk</th><th>nama_mk</th><th>id_dosen</th></tr>${L.map(r => `<tr class="${t === 'leftonly' ? (rIds.has(r[2]) ? 'gone' : 'hl') : cls(rIds.has(r[2]), keepL)}">${r.map(fmtCell).join('')}</tr>`).join('')}</table>`;

function drawCorr(el){

    h += `<tr class="${tr}"${cls}><td>${k + 1}</td>${fmtCell(r[0])}${fmtCell(r[1])}${fmtCell(r[2])}<td>${shown ? r[3] : '?'}</td><td>${shown ? (r[2] === null ? 'NULL (nggak diketahui) → nggak ikut' : pass ? 'YA → ikut' : 'TIDAK') : ''}</td></tr>`;
  });
  el.querySelector('.tblwrap').innerHTML = h + '</table>';

  } else if (i >= rows.length) el.querySelector('.step-msg').innerHTML = `Selesai. Query dalam dijalankan <b>${rows.length} kali</b> (sekali per baris tabel luar). Baris hijau adalah hasil akhirnya.`;
}

/* ---------- ERD ---------- */
function erd(tables, links, W, H){
  const RH = 19, HH = 26, BW = 168;
  const pos = {};
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Diagram relasi tabel">`;
  for (const t of tables) {
    const h = HH + t.cols.length * RH + 6;
    pos[t.name] = { x: t.x, y: t.y, h, cols: t.cols.map(c => c.replace(/[*#]/g, '')) };
    s += `<g><rect x="${t.x}" y="${t.y}" width="${BW}" height="${h}" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
      <rect x="${t.x}" y="${t.y}" width="${BW}" height="${HH}" rx="8" fill="var(--acc2)"/><rect x="${t.x}" y="${t.y + HH - 8}" width="${BW}" height="8" fill="var(--acc2)"/>
      <text x="${t.x + 10}" y="${t.y + 18}" font-size="13.5" font-weight="700" fill="var(--fg)">${t.name}</text>`;
    t.cols.forEach((c, i) => {
      const pk = c.includes('*'), fk = c.includes('#'); const name = c.replace(/[*#]/g, '');
      s += `<text x="${t.x + 10}" y="${t.y + HH + 15 + i * RH}" font-size="12.5" fill="${pk ? 'var(--t-num)' : fk ? 'var(--t-fn)' : 'var(--fg)'}" font-weight="${pk ? 700 : 400}">${pk ? '🔑 ' : fk ? '↗ ' : ''}${name}</text>`;
    });
    s += '</g>';
  }
  for (const [a, b, la, lb] of links) {
    const [ta, ca] = a.split('.'), [tb, cb] = b.split('.');
    const A = pos[ta], B = pos[tb];
    const ya = A.y + HH + 11 + A.cols.indexOf(ca) * RH, yb = B.y + HH + 11 + B.cols.indexOf(cb) * RH;
    let xa, xb;
    if (A.x + BW < B.x) { xa = A.x + BW; xb = B.x; } else if (B.x + BW < A.x) { xa = A.x; xb = B.x + BW; } else { xa = A.x + BW; xb = B.x + BW; }
    const mx = (xa === A.x + BW && xb === B.x + BW) ? Math.max(xa, xb) + 30 : (xa + xb) / 2;
    s += `<path d="M${xa} ${ya} H${mx} V${yb} H${xb}" fill="none" stroke="var(--mut)" stroke-width="1.5"/>`;
    const da = xa < mx ? 1 : -1, db = xb < mx ? 1 : -1;
    s += `<text x="${xa + da * 10}" y="${ya - 4}" font-size="12" font-weight="700" fill="var(--acc)" text-anchor="middle">${la}</text><text x="${xb + db * 10}" y="${yb - 4}" font-size="12" font-weight="700" fill="var(--acc)" text-anchor="middle">${lb}</text>`;
  }
  return s + '</svg>';
}
